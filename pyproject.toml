[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-signal-protocol"
version = "0.1.0"
description = "Python Signal Protocol with WhatsApp v3/v4 interoperability, Double Ratchet, Sender Keys, and ML-KEM-512/768/1024."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
dependencies = ["cryptography>=43", "PyNaCl>=1.5", "protobuf>=6.33.5,<7", "kyber-py==1.2.0", "pqcrypto==0.4.0"]
keywords = ["signal-protocol", "whatsapp", "end-to-end-encryption", "double-ratchet", "ml-kem", "post-quantum-cryptography"]

[project.urls]
Source = "https://github.com/WhatsappWiki/whatsapp-signal-protocol"
Issues = "https://github.com/WhatsappWiki/whatsapp-signal-protocol/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.9", "grpcio-tools>=1.78,<1.81"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_protocol = ["py.typed", "protobuf/*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["interop"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
